name: Déploiement

# Déclenché à la main, ou par une étiquette de version. Jamais sur une
# poussée vers main : un déploiement doit être une décision, pas un effet
# de bord d'un commit.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:

  # ── Publication de l'image ──────────────────────────────────────────────
  publier:
    name: Publier l'image
    runs-on: ubuntu-latest
    outputs:
      etiquette: ${{ steps.version.outputs.etiquette }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # L'image est étiquetée par le numéro de version quand il y en a un,
      # par le hachage du commit sinon. Jamais seulement "latest" : une
      # étiquette mouvante rend impossible de dire quelle version tourne,
      # et donc de revenir en arrière.
      - name: Déterminer l'étiquette
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "etiquette=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "etiquette=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # Le jeton est fourni par GitHub pour la durée du job, il n'y a donc
      # aucun identifiant de registre à stocker dans le dépôt.
      - name: S'authentifier auprès du registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les tests tournent dans le Dockerfile : une image qui se construit
      # est une image dont les tests passent.
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.etiquette }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Mise en ligne ───────────────────────────────────────────────────────
  deployer:
    name: Mettre en ligne
    runs-on: ubuntu-latest
    needs: publier
    # L'environnement permet d'exiger une validation manuelle côté GitHub
    # avant la mise en ligne, et garde une trace de chaque déploiement.
    environment:
      name: production
      url: ${{ steps.miseEnLigne.outputs.webapp-url }}

    steps:
      - name: Déployer sur App Service
        id: miseEnLigne
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_NOM_APPLICATION }}
          publish-profile: ${{ secrets.AZURE_PROFIL_PUBLICATION }}
          images: ${{ env.IMAGE }}:${{ needs.publier.outputs.etiquette }}
